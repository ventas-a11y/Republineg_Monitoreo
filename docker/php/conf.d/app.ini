; Endurecimiento de PHP para producción (docs/SEGURIDAD.md, PHP_Configuration).
; No se usa la lista completa de disable_functions: Horizon necesita proc_open.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

allow_url_fopen = Off
allow_url_include = Off

zend.exception_ignore_args = On

memory_limit = 256M
; Una Captura por monitor, ~1920 px en WebP, cabe con holgura en 8M.
post_max_size = 16M
upload_max_filesize = 8M
max_file_uploads = 8

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
